openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: documents
    description: Collaborative document operations
  - name: activity
    description: Workspace activity
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List collaborative documents
      responses:
        "200":
          description: Documents visible to the current user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: createDocument
      tags: [documents]
      summary: Create a collaborative document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Created document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
  /documents/{documentId}:
    get:
      operationId: getDocument
      tags: [documents]
      summary: Get a collaborative document
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Document detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateDocument
      tags: [documents]
      summary: Update document metadata or saved content
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentUpdate"
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /activity:
    get:
      operationId: listActivity
      tags: [activity]
      summary: List recent workspace activity
      responses:
        "200":
          description: Recent activity events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEvent"
components:
  parameters:
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Document:
      type: object
      required: [id, name, content, updatedAt, owner, collaborators]
      properties:
        id:
          type: string
        name:
          type: string
        content:
          type: string
        updatedAt:
          type: string
          format: date-time
        owner:
          $ref: "#/components/schemas/Person"
        collaborators:
          type: array
          items:
            $ref: "#/components/schemas/Person"
    DocumentInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        content:
          type: string
          default: ""
    DocumentUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        content:
          type: string
    Person:
      type: object
      required: [id, name, initials, color]
      properties:
        id:
          type: string
        name:
          type: string
        initials:
          type: string
        color:
          type: string
    ActivityEvent:
      type: object
      required: [id, type, actor, documentName, timestamp]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [created, edited, joined, saved]
        actor:
          $ref: "#/components/schemas/Person"
        documentName:
          type: string
        timestamp:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

